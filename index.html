<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Element Club Photo Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Big+Shoulders+Display:wght@600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="config.js"></script>
<style>
:root{
  --wall:#EDEFF1;--surface:#FFFFFF;--ink:#17161B;--ink2:#3B3A42;--muted:#666A75;--line:#D7DAE0;--line2:#E7E9ED;
  --crimson:#9F1D35;--crimson-ink:#7E1529;--crimson-tint:#F7E4E8;
  --gold:#A87914;--gold-bright:#D9A632;--gold-tint:#F8EDD3;
  --green:#2C7A53;--green-tint:#DFF0E6;--amber:#9E5B0A;--amber-tint:#FBEBD3;--blue:#2D5B9A;--blue-tint:#E2EBF7;
  --rail:#17161B;--rail-text:#A9A8B2;
  --display:'Big Shoulders Display',Impact,'Arial Narrow',sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,sans-serif;
  --r-sm:6px;--r-md:10px;--r-lg:16px;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--wall);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--crimson);text-underline-offset:2px}
:focus-visible{outline:3px solid var(--gold-bright);outline-offset:2px;border-radius:4px}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- App frame ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.rail{background:var(--rail);color:#fff;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:22px 14px 16px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px}
.brand img{max-height:40px;max-width:180px;display:block}
.brand .word{font-family:var(--display);font-weight:900;font-size:30px;letter-spacing:.06em;line-height:1}
.brand .tag{font-size:12.5px;color:var(--rail-text);line-height:1.25;margin-top:4px}
.rail nav a{display:flex;align-items:center;gap:11px;padding:9px 10px 9px 12px;margin:1px 0;color:var(--rail-text);text-decoration:none;border-radius:8px;position:relative;font-weight:700;font-size:14.5px}
.rail nav a:hover{color:#fff;background:#24232A}
.rail nav a.on{color:#fff;background:#24232A}
.rail nav a.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--crimson)}
.rail nav a svg{width:18px;height:18px;flex:none}
.rail nav .ct{margin-left:auto;background:var(--crimson);color:#fff;font-size:12px;border-radius:999px;padding:0 7px;line-height:20px;font-weight:700}
.rail .group{color:#77767F;font-size:12.5px;margin:18px 12px 6px}
.rail .foot{margin-top:auto;padding-top:16px;border-top:1px solid #2B2A31}
.who{display:flex;align-items:center;gap:10px;padding:6px 8px}
.who img{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#333}
.who .n{font-weight:700;font-size:14px;line-height:1.2}
.who .r{font-size:12.5px;color:var(--rail-text)}
.who .pts{margin-left:auto;font-weight:700;font-size:20px;color:var(--gold-bright);line-height:1}
.who .pts small{font-family:var(--body);font-size:11px;font-weight:700;color:var(--rail-text);display:block;text-align:right}
.rail .signout{background:none;border:0;color:var(--rail-text);font-size:13px;padding:4px 8px;cursor:pointer;text-decoration:underline}
main{padding:34px 40px 100px;min-width:0;max-width:1440px}

/* Mobile chrome */
.mtop,.mtabs{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{display:none}
  .mtop{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30;background:var(--rail);color:#fff;padding:calc(10px + var(--safe-t)) 16px 10px}
  .mtop .brand{padding:0}
  .mtop .brand .word{font-size:24px}
  .mtop .brand .tag{display:none}
  .mtop .brand img{max-height:30px}
  .mtop .sp{flex:1}
  .mtop .pts{font-family:var(--display);font-weight:800;font-size:20px;color:var(--gold-bright)}
  .mtop img.av{width:30px;height:30px;border-radius:50%}
  .mtabs{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + var(--safe-b))}
  .mtabs a,.mtabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:700;color:var(--muted);text-decoration:none;background:none;border:0;padding:4px 0;position:relative}
  .mtabs svg{width:22px;height:22px}
  .mtabs .on{color:var(--crimson)}
  .mtabs .dot{position:absolute;top:2px;right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;background:var(--crimson)}
  main{padding:20px 16px calc(96px + var(--safe-b))}
}

/* ---------- Type ---------- */
.ph{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.ph .t{flex:1;min-width:240px}
h1{font-family:var(--display);font-weight:800;font-size:46px;line-height:.95;margin:0;letter-spacing:.005em}
.lede{color:var(--muted);margin:8px 0 0;max-width:64ch}
h2{font-family:var(--display);font-weight:800;font-size:28px;line-height:1;margin:0 0 4px}
h3{font-size:16px;margin:0 0 4px}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums}
@media (max-width:900px){h1{font-size:38px}}

/* ---------- Controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--ink);min-height:40px}
.btn:hover{border-color:#B9BDC6}
.btn.pri{background:var(--crimson);border-color:var(--crimson);color:#fff}
.btn.pri:hover{background:var(--crimson-ink);border-color:var(--crimson-ink)}
.btn.ink{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.gold{background:var(--gold-tint);border-color:#E9D29B;color:#6E4E08}
.btn.quiet{background:transparent;border-color:transparent;color:var(--ink2)}
.btn.quiet:hover{background:var(--line2)}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px;border-radius:7px}
.btn.lg{min-height:48px;padding:12px 20px;font-size:15.5px}
.btn.block{width:100%}
.btn.danger{color:var(--crimson)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:none}
.ibtn{border:0;background:transparent;width:34px;height:34px;border-radius:8px;cursor:pointer;color:var(--muted);display:inline-grid;place-items:center}
.ibtn:hover{background:var(--line2);color:var(--ink)}
.ibtn svg{width:17px;height:17px}
.gbtn{display:inline-flex;align-items:center;gap:12px;background:#fff;color:#1f1f1f;border:1px solid #747775;border-radius:999px;padding:0 22px;height:48px;font-weight:700;font-size:15.5px;cursor:pointer}
.gbtn:hover{background:#F6F7F8}
.gbtn svg{width:20px;height:20px}

label.f{display:block;font-weight:700;font-size:13.5px;margin-bottom:6px;color:var(--ink2)}
.field{margin-bottom:16px}
.help{font-size:13px;color:var(--muted);margin-top:5px}
input[type=text],input[type=email],input[type=date],input[type=time],input[type=url],input[type=number],input[type=search],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;width:100%;outline:none;min-height:42px}
textarea{min-height:100px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--ink);box-shadow:0 0 0 3px var(--line2)}
.row{display:flex;gap:12px}.row>*{flex:1;min-width:0}
@media (max-width:640px){.row{flex-direction:column;gap:0}}
.check{display:flex;align-items:center;gap:9px;font-weight:700;cursor:pointer;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--crimson)}
.seg{display:inline-flex;background:var(--line2);border-radius:9px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;cursor:pointer;font-weight:700;color:var(--muted);font-size:13.5px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(23,22,27,.12)}
.search{position:relative;min-width:200px}
.search input{padding-left:36px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--line2);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700;border:1px solid transparent}
.chip.tog{cursor:pointer;background:var(--surface);border-color:var(--line)}
.chip.tog:hover{border-color:#B9BDC6}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.goldc.on{background:var(--gold);border-color:var(--gold)}
.chip button{border:0;background:none;padding:0;cursor:pointer;color:inherit;opacity:.7;font-size:15px;line-height:1}

/* ---------- Surfaces ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px 22px}
.panel.tight{padding:0;overflow:hidden}
.panel-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line2)}
.panel-h h2{flex:1;font-size:24px;margin:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}
.grid-side{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
@media (max-width:1100px){.grid2,.grid-side{grid-template-columns:1fr}}
.note{display:flex;gap:12px;align-items:flex-start;border-radius:var(--r-md);padding:13px 16px;margin-bottom:18px;background:var(--blue-tint);color:#1F3F6D}
.note.warn{background:var(--amber-tint);color:#6B3E05}
.note.red{background:var(--crimson-tint);color:#6A1222}
.note.good{background:var(--green-tint);color:#1C5238}
.note svg{width:19px;height:19px;flex:none;margin-top:2px}
.note b{font-weight:700}
.empty{padding:40px 24px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.empty .btn{margin-top:14px}

/* ---------- Toolbar ---------- */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.toolbar .sp{flex:1}
.week{display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-height:42px}
.week button{border:0;background:transparent;padding:0 13px;cursor:pointer;font-size:18px;font-weight:700}
.week button:hover{background:var(--line2)}
.week .lbl{display:flex;align-items:center;padding:0 14px;font-weight:700;border-left:1px solid var(--line);border-right:1px solid var(--line);white-space:nowrap}

/* ---------- Progress strip ---------- */
.progress{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 20px;margin-bottom:20px;display:grid;grid-template-columns:auto 1fr;gap:6px 28px;align-items:center}
.progress .big{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;grid-row:span 2}
.progress .big span{color:var(--muted);font-size:24px}
.segbar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--line2);gap:2px}
.segbar i{display:block;height:100%}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13.5px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
@media (max-width:640px){.progress{grid-template-columns:1fr}.progress .big{grid-row:auto}}

/* ---------- Status ---------- */
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:3px 10px;border-radius:6px;white-space:nowrap}
.st.open{background:var(--crimson-tint);color:var(--crimson)}
.st.assigned{background:var(--blue-tint);color:var(--blue)}
.st.progress{background:var(--amber-tint);color:var(--amber)}
.st.done{background:var(--green-tint);color:var(--green)}
.st.gold{background:var(--gold-tint);color:#6E4E08}
.st.grey{background:var(--line2);color:var(--muted)}
:root{--c-open:#C6455B;--c-assigned:#4F7CC0;--c-progress:#D08A2A;--c-review:#8B6FD1;--c-done:#3E9A6B}
.st.review{background:#ECE6FA;color:#5B3FA8}
.frame.s-review::before{background:var(--c-review)}
.done-btn.is-pending{border-color:#C9BCF0;background:#ECE6FA;color:#5B3FA8}
.done-btn.is-pending:hover{background:var(--crimson-tint);border-color:var(--crimson);color:var(--crimson)}
.done-btn.is-pending[disabled]{border-style:solid;border-color:#C9BCF0;background:#ECE6FA;color:#5B3FA8}
.pl .sub.back{color:var(--crimson)}

/* ---------- Contact sheet ---------- */
.day{display:grid;grid-template-columns:132px minmax(0,1fr);gap:18px;padding:18px 0;border-top:1px solid var(--line)}
.day:first-child{border-top:0;padding-top:4px}
.dlabel .dw{font-family:var(--display);font-weight:900;font-size:44px;line-height:.9}
.dlabel .dd{color:var(--muted);font-weight:700;margin-top:4px}
.dlabel.today .dw{color:var(--crimson)}
.frames{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.frame{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px 14px 20px;position:relative;display:flex;flex-direction:column;gap:9px;overflow:hidden}
.frame::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c-assigned)}
.frame.s-open::before{background:var(--c-open)}
.frame.s-progress::before{background:var(--c-progress)}
.frame.s-done::before{background:var(--c-done)}
.frame .fno{position:absolute;right:14px;top:10px;font-family:var(--display);font-weight:700;font-size:26px;color:#CDD1D8;line-height:1}
.frame .club{font-family:var(--display);font-weight:800;font-size:25px;line-height:1;padding-right:38px}
.frame .meta{display:flex;flex-direction:column;gap:3px;color:var(--ink2);font-size:14px}
.frame .meta div{display:flex;gap:8px;align-items:flex-start}
.frame .meta svg{width:15px;height:15px;color:var(--muted);flex:none;margin-top:3px}
.frame .task{font-size:14px}
.frame .flag{font-size:13px;font-weight:700;color:var(--crimson)}
.frame .fnote{font-size:13px;color:var(--muted);border-left:2px solid var(--line);padding-left:9px}
.frame .people{display:flex;flex-direction:column;gap:6px;padding-top:9px;border-top:1px dashed var(--line)}
.frame .acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:auto;padding-top:4px}
.frame .acts .sp{flex:1}
@media (max-width:900px){.day{grid-template-columns:1fr;gap:10px}.dlabel{display:flex;align-items:baseline;gap:10px}.dlabel .dw{font-size:36px}}

/* person line */
.pl{display:flex;align-items:center;gap:9px;min-height:32px}
.pl .av{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11.5px;font-weight:700;color:#fff;background:#7A7F8C}
.pl .nm{font-weight:700;font-size:14px;line-height:1.2}
.pl .sub{font-size:12.5px;color:var(--muted)}
.pl .grow{flex:1;min-width:0}
.pl.me .nm{color:var(--crimson)}
.done-btn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--ink);background:var(--surface);border-radius:8px;padding:5px 10px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;min-height:34px}
.done-btn:hover{background:var(--ink);color:#fff}
.done-btn.is-done{border-color:var(--green);background:var(--green-tint);color:var(--green)}
.done-btn.is-done:hover{background:var(--crimson-tint);border-color:var(--crimson);color:var(--crimson)}
.done-btn[disabled]{border-style:dashed;border-color:var(--line);color:var(--muted);cursor:default;background:transparent}
.done-btn.is-done[disabled]{border-style:solid;border-color:#BFE0CD;color:var(--green);background:var(--green-tint)}
.done-btn svg{width:14px;height:14px}
.plus{font-weight:700;color:var(--gold);font-size:13px}

/* ---------- Sheet table ---------- */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:auto}
.sheet-cap{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.sheet-cap b{font-family:var(--display);font-weight:800;font-size:22px;flex:1}
table{border-collapse:collapse;width:100%}
th{text-align:left;font-size:13px;color:var(--muted);font-weight:700;padding:10px 14px;border-bottom:1px solid var(--line);background:#F7F8F9;white-space:nowrap;position:sticky;top:0;z-index:1}
td{padding:12px 14px;border-bottom:1px solid var(--line2);vertical-align:top;font-size:14px}
tr:last-child td{border-bottom:0}
tr.dayrow td{background:#F7F8F9;font-family:var(--display);font-weight:800;font-size:19px;padding:8px 14px;border-bottom:1px solid var(--line)}
td.b{font-weight:700}
td.nowrap{white-space:nowrap}
td.act{white-space:nowrap;text-align:right}
@media (max-width:900px){
  table.stack thead{display:none}
  table.stack,table.stack tbody,table.stack tr,table.stack td{display:block;width:100%}
  table.stack tr{border-bottom:1px solid var(--line);padding:8px 0}
  table.stack tr.dayrow{padding:0}
  table.stack td{border:0;padding:4px 16px}
  table.stack td[data-l]::before{content:attr(data-l);display:block;font-size:12px;color:var(--muted);font-weight:700}
  table.stack td.act{text-align:left}
}

/* ---------- Home ---------- */
.hello{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:end;margin-bottom:24px}
.pointcard{background:var(--ink);color:#fff;border-radius:var(--r-lg);padding:16px 22px;display:flex;align-items:center;gap:18px;min-width:260px}
.pointcard .v{font-family:var(--display);font-weight:900;font-size:64px;line-height:.85;color:var(--gold-bright)}
.pointcard .l{font-size:14px;color:#C9C8D0;line-height:1.35}
.pointcard .l b{color:#fff;display:block;font-size:15px}
@media (max-width:700px){.hello{grid-template-columns:1fr}}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:14px;align-items:center;padding:13px 20px;border-top:1px solid var(--line2)}
.li:first-child{border-top:0}
.li .when{width:62px;flex:none;text-align:center;line-height:1}
.li .when b{display:block;font-family:var(--display);font-weight:900;font-size:28px}
.li .when span{font-size:12.5px;color:var(--muted);font-weight:700}
.li .what{flex:1;min-width:0}
.li .what .c{font-weight:700;font-size:15.5px}
.li .what .m{font-size:13.5px;color:var(--muted)}
.li .go{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:640px){.li{flex-wrap:wrap}.li .go{width:100%;justify-content:flex-start;padding-left:76px}}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line2)}
.steps li:first-child{border-top:0}
.steps .box{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.steps li.ok .box{background:var(--green);border-color:var(--green);color:#fff}
.steps li.ok .tx{color:var(--muted);text-decoration:line-through}
.steps .box svg{width:13px;height:13px}
.steps .tx{flex:1;font-weight:700;font-size:14.5px}

/* ---------- Leaderboard ---------- */
.lb{list-style:none;margin:0;padding:0}
.lb li{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 20px;border-top:1px solid var(--line2)}
.lb li:first-child{border-top:0}
.lb .rk{font-family:var(--display);font-weight:900;font-size:26px;color:#B6BAC3;text-align:center}
.lb li:nth-child(-n+3) .rk{color:var(--gold)}
.lb .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .pt{font-family:var(--display);font-weight:800;font-size:24px;color:var(--gold);text-align:right}
.lb .bar{grid-column:2/4;height:5px;border-radius:9px;background:var(--line2);overflow:hidden}
.lb .bar i{display:block;height:100%;background:var(--gold-bright)}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:flex;gap:12px;padding:11px 20px;border-top:1px solid var(--line2);align-items:center}
.feed li:first-child{border-top:0}
.feed .amt{font-family:var(--display);font-weight:800;font-size:22px;width:46px;text-align:right;color:var(--gold)}
.feed .amt.neg{color:var(--crimson)}
.feed .tx{flex:1;min-width:0;font-size:14px}
.feed .tx b{display:block}

/* ---------- Modal / toast ---------- */
.ov{position:fixed;inset:0;background:rgba(23,22,27,.5);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow:auto;animation:fade .15s}
.modal{background:var(--surface);border-radius:var(--r-lg);width:100%;max-width:600px;animation:rise .18s ease-out}
.modal.wide{max-width:860px}
.mh{display:flex;align-items:center;gap:10px;padding:18px 22px 12px}
.mh h2{flex:1;font-size:30px;margin:0}
.mb{padding:6px 22px 20px}
.mf{display:flex;gap:10px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--line2);flex-wrap:wrap}
@media (max-width:640px){.ov{padding:0;align-items:flex-end}.modal{border-radius:var(--r-lg) var(--r-lg) 0 0;max-height:92vh;overflow:auto}.mf{position:sticky;bottom:0;background:var(--surface);padding-bottom:calc(14px + var(--safe-b))}.mf .btn{flex:1}}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(10px);opacity:0}}
#toasts{position:fixed;bottom:calc(22px + var(--safe-b));left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
@media (max-width:900px){#toasts{bottom:calc(84px + var(--safe-b))}}
.toast{background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-weight:700;animation:rise .2s;max-width:90vw}
.toast.err{background:var(--crimson)}
.toast.gold{background:#2A1F05;color:var(--gold-bright)}

/* ---------- Picker ---------- */
.picker{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.picker .pq{border:0;border-bottom:1px solid var(--line);border-radius:0;box-shadow:none}
.picker .opts{max-height:210px;overflow:auto;padding:4px}
.picker label{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;cursor:pointer;font-size:14px}
.picker label:hover{background:var(--line2)}
.picker label input{accent-color:var(--crimson);width:16px;height:16px}
.picker .sel{padding:9px;border-bottom:1px solid var(--line);min-height:20px}

/* ---------- Role cards / invites ---------- */
.roles3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.rcard{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;background:var(--surface);text-align:left}
.rcard:hover{border-color:#B9BDC6}
.rcard.on{border-color:var(--crimson);box-shadow:inset 0 0 0 1px var(--crimson)}
.rcard b{display:block;font-family:var(--display);font-weight:800;font-size:22px;line-height:1.1}
.rcard span{font-size:13px;color:var(--muted);line-height:1.35;display:block;margin-top:2px}
.rcard[disabled]{opacity:.4;cursor:not-allowed}
@media (max-width:700px){.roles3{grid-template-columns:1fr}}
.rb{display:inline-block;font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:6px;background:var(--line2);color:var(--ink2)}
.rb.Admin{background:var(--crimson-tint);color:var(--crimson)}
.rb.Manager{background:var(--gold-tint);color:#6E4E08}
.rb.Member{background:var(--green-tint);color:var(--green)}
.linkbox{display:flex;gap:8px;align-items:center;background:var(--line2);border-radius:10px;padding:8px 8px 8px 12px}
.linkbox code{flex:1;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow:auto}
.tabs button{border:0;background:transparent;padding:10px 14px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--crimson)}
.preview{white-space:pre-wrap;font-size:14px;background:#F7F8F9;border:1px solid var(--line);border-radius:10px;padding:14px;max-height:280px;overflow:auto}
.recips{max-height:150px;overflow:auto;padding:10px;border:1px solid var(--line);border-radius:10px;background:#F7F8F9}

/* ---------- QR ---------- */
.qr{display:block;width:100%;height:auto;image-rendering:pixelated}
.qrbox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
.qrbox .qrw{width:220px;max-width:100%;margin:0 auto}
.qrbox b{display:block;font-family:var(--display);font-weight:800;font-size:22px;margin-top:8px;line-height:1.05}
.qrbox span{font-size:13px;color:var(--muted)}
.qrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.poster{background:var(--ink);color:#fff;border-radius:16px;padding:26px;text-align:center}
.poster h2{font-size:40px;margin:0 0 6px}
.poster .qrw{background:#fff;border-radius:12px;padding:12px;width:260px;max-width:100%;margin:16px auto}
@media print{
  body *{visibility:hidden}
  .printable,.printable *{visibility:visible}
  .printable{position:absolute;left:0;top:0;width:100%}
  .ov{background:none;position:static;padding:0}
  .no-print{display:none!important}
}

/* ---------- Help ---------- */
.help-tabs{margin-bottom:22px}
.tut{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:28px;align-items:center;padding:28px 0;border-top:1px solid var(--line)}
.tut:first-of-type{border-top:0;padding-top:4px}
.tut .k{font-family:var(--display);font-weight:900;font-size:56px;line-height:.85;color:#C5C9D1}
.tut h2{font-size:32px;margin:6px 0 8px}
.tut ol{margin:0;padding-left:20px;line-height:1.65}
.tut ol li{margin-bottom:4px}
.tut figure{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tut figure img{display:block;width:100%;height:auto}
.tut.mobile figure{max-width:330px;justify-self:center;border-radius:22px;border:8px solid var(--ink)}
@media (max-width:900px){.tut{grid-template-columns:1fr;gap:14px}}

/* ---------- Landing (hosted, signed out) ---------- */
.landing{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);background:var(--ink);color:#fff}
.landing .l{padding:56px 56px 40px;display:flex;flex-direction:column;justify-content:space-between;gap:30px}
.landing .big{font-family:var(--display);font-weight:900;font-size:clamp(64px,10vw,150px);line-height:.82;letter-spacing:.01em;margin:0}
.landing .big em{font-style:normal;color:var(--gold-bright)}
.landing p{color:#C9C8D0;max-width:44ch;font-size:17px}
.landing .r{background:var(--wall);color:var(--ink);padding:56px 48px;display:flex;flex-direction:column;justify-content:center;gap:26px}
.landing .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px}
.landing .sheetstrip{display:flex;gap:8px}
.landing .sheetstrip i{flex:1;height:56px;border-radius:6px;background:#26252C;position:relative}
.landing .sheetstrip i::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:6px 0 0 6px;background:var(--c-done)}
.landing .sheetstrip i:nth-child(2)::before{background:var(--c-assigned)}
.landing .sheetstrip i:nth-child(3)::before{background:var(--c-open)}
.landing .sheetstrip i:nth-child(4)::before{background:var(--c-progress)}
@media (max-width:900px){.landing{grid-template-columns:1fr}.landing .l{padding:36px 24px 28px}.landing .r{padding:28px 18px 48px}}
.loading{display:flex;align-items:center;gap:12px;color:var(--muted);padding:60px 0;justify-content:center}
.spin{width:20px;height:20px;border:3px solid var(--line);border-top-color:var(--crimson);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>

<script>
"use strict";
/* =====================================================================
   Element Club Photo Tracker
   Runs two ways from this one file:
   - On claude.ai as an artifact (data in the artifact database)
   - Self-hosted with Firebase (Google sign-in, Firestore) when config.js
     provides ELEMENT_CONFIG.firebase. Optional Apps Script mail relay.
   ===================================================================== */
const CFG=(window.ELEMENT_CONFIG&&typeof window.ELEMENT_CONFIG==='object')?window.ELEMENT_CONFIG:{};
const MODE=(CFG.firebase&&CFG.firebase.apiKey&&!/PASTE|YOUR_/i.test(CFG.firebase.apiKey))?'firebase':'claude';

/* ---------- Icons ---------- */
const sv=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const I={
  home:sv('<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'),
  cal:sv('<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>'),
  grid:sv('<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>'),
  star:sv('<path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/>'),
  hand:sv('<path d="M18 11V6a2 2 0 0 0-4 0v5M14 10V4a2 2 0 0 0-4 0v6M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/>'),
  pen:sv('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>'),
  mail:sv('<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/>'),
  users:sv('<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>'),
  gear:sv('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'),
  help:sv('<circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/>'),
  plus:sv('<path d="M12 5v14M5 12h14"/>'),
  check:sv('<path d="M20 6 9 17l-5-5"/>'),
  trash:sv('<path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>'),
  bell:sv('<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>'),
  link:sv('<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>'),
  folder:sv('<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>'),
  copy:sv('<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>'),
  search:sv('<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>'),
  info:sv('<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>'),
  clock:sv('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
  pin:sv('<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>'),
  qr:sv('<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 17h3v3h-3z"/>'),
  dup:sv('<rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>'),
  x:sv('<path d="M18 6 6 18M6 6l12 12"/>'),
  more:sv('<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>'),
  medal:sv('<circle cx="12" cy="15" r="6"/><path d="M8.5 10 6 2h4l2 5 2-5h4l-2.5 8"/><path d="M12 12.5v5M10 15h4"/>'),
  list:sv('<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>'),
  sheet:sv('<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/>'),
  send:sv('<path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/>'),
  print:sv('<path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>'),
  google:'<svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>'
};

/* ---------- Helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseISO=s=>{if(!s||!/^\d{4}-\d{2}-\d{2}$/.test(s))return null;const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const mondayOf=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const todayISO=()=>iso(new Date());
const fmtDay=s=>{const d=parseISO(s);return d?d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}):(s||'')};
const fmtShort=s=>{const d=parseISO(s);return d?d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}):(s||'')};
const fmtMD=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
const fmtLong=d=>d.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
const fmtTime=t=>{if(!t||!/^\d{1,2}:\d{2}/.test(t))return t||'';const[h,m]=t.split(':').map(Number);return `${(h%12)||12}:${pad(m)} ${h<12?'AM':'PM'}`};
const timeRange=a=>a.start?(fmtTime(a.start)+(a.end?'–'+fmtTime(a.end):'')):(a.time||'Time TBD');
const clock=ts=>{try{return new Date(ts).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}catch(_){return''}};
const ago=ts=>{if(!ts)return'';const s=(Date.now()-new Date(ts).getTime())/1000;if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+' min ago';if(s<86400)return Math.floor(s/3600)+' hr ago';const d=Math.floor(s/86400);return d<30?d+(d===1?' day ago':' days ago'):new Date(ts).toLocaleDateString()};
const norm=s=>String(s||'').trim().toLowerCase();
const isEmail=s=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(s||'').trim());
const randCode=n=>{const a=new Uint8Array(n);crypto.getRandomValues(a);return Array.from(a,b=>'abcdefghjkmnpqrstuvwxyz23456789'[b%31]).join('')};
const nowISO=()=>new Date().toISOString();
const clone=o=>JSON.parse(JSON.stringify(o||{}));
const subId=e=>norm(e).replace(/[^a-z0-9@._+-]/g,'_').slice(0,180)||'x';
const plural=(n,w,p)=>`${n} ${n===1?w:(p||w+'s')}`;
const firstName=n=>{n=String(n||'');if(n.includes(','))return n.split(',')[1].trim().split(' ')[0]||n;return n.split(' ')[0]};
const displayName=n=>{n=String(n||'');if(!n.includes(','))return n;const[l,f]=n.split(',');return `${(f||'').trim()} ${l.trim()}`.trim()};
const initials=n=>{const d=displayName(n).replace(/^(Mr|Mrs|Ms|Dr)\.?\s+/i,'').split(/\s+/).filter(Boolean);return((d[0]||'?')[0]+((d[d.length-1]||'')[0]||'')).toUpperCase()};
const hueOf=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h};
const avatarBg=s=>`hsl(${hueOf(s)} 28% 42%)`;
const avatarData=n=>`data:image/svg+xml,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><rect width="40" height="40" fill="${avatarBg(n||'?')}"/><text x="20" y="25.5" font-family="Arial" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">${esc(initials(n||'?'))}</text></svg>`)}`;
const store={get(k){try{return localStorage.getItem('element.'+k)}catch(_){return null}},set(k,v){try{localStorage.setItem('element.'+k,v)}catch(_){}}};

/* ---------- State ---------- */
const S={settings:{},loaded:new Set(),me:{id:null,email:null,name:'',isOwner:false,avatarUrl:''},
  signedIn:MODE==='claude',canWrite:null,readOnly:false,week:mondayOf(new Date()),view:'home',
  f:{q:'',mine:false,status:'all',clubFilter:'all',clubQ:'',phQ:'',subQ:'',reqTab:'pending',teamTab:'invite',helpTab:'member'},
  layout:store.get('layout')||(window.innerWidth<900?'cards':'cards'),
  pending:null,inviteChecked:false,emailDraft:null,mySub:null,mySubChecked:false};
const COLS_ALL=['assignments','photographers','clubs','roles','requests','awards','invites','emails','users'];
COLS_ALL.forEach(c=>S[c]=[]);
let DB=null,USER=null,FB=null;

/* ---------- Roles & derived ---------- */
const ROLE_RANK={Guest:0,Member:1,Manager:2,Admin:3};
const ROLE_DESC={
  Admin:'Runs everything: shoots, roster, points, emails, invites, roles and settings.',
  Manager:'Runs the week: posts shoots, edits the roster, awards points, approves requests, sends emails, invites members.',
  Member:'Photographer: sees shoots, checks in, marks shoots done to earn points, requests clubs.'
};
const myRoleDoc=()=>S.roles.find(r=>r.id===S.me.id);

function myPid(){
  const r=myRoleDoc();
  if(r&&r.photographerId&&S.photographers.some(p=>p.id===r.photographerId))return r.photographerId;
  if(S.me.email){const p=S.photographers.find(p=>p.email&&norm(p.email)===norm(S.me.email));if(p)return p.id}

const cState=c=>!c?null:(c.status||'approved');
const isCredited=c=>cState(c)==='approved';
function pendingCredits(){const out=[];for(const a of S.assignments)for(const[pid,c]of Object.entries(a.completions||{}))if(cState(c)==='pending'&&(a.photographers||[]).includes(pid))out.push({a,pid,c});return out.sort((x,y)=>(x.c.at||'').localeCompare(y.c.at||''))}
function aStatus(a){
  const ps=a.photographers||[];
  if(!ps.length)return'open';
  const cs=ps.map(p=>cState((a.completions||{})[p]));
  const ok=cs.filter(x=>x==='approved').length,pend=cs.filter(x=>x==='pending').length;
  if(ok===ps.length)return'done';
  if(ok+pend===ps.length)return'review';
  return ok+pend?'progress':'assigned';
}
const ST_LABEL={open:'Needs a photographer',assigned:'Assigned',progress:'Partly done',review:'Pending credit',done:'Completed'};
function pointsMap(){
  const m={};
  for(const p of S.photographers)m[p.id]={earned:0,bonus:Number(p.bonus)||0,awarded:0,shoots:[],awards:[],pending:0};
  for(const a of S.assignments){
    for(const[pid,c]of Object.entries(a.completions||{})){
      if(!m[pid])continue;
      if(isCredited(c)){m[pid].earned+=Number(c&&c.points!=null?c.points:1)||0;m[pid].shoots.push(a)}
      else if(cState(c)==='pending')m[pid].pending++;
    }
  }
  for(const w of S.awards){if(m[w.photographerId]){m[w.photographerId].awarded+=Number(w.points)||0;m[w.photographerId].awards.push(w)}}
  for(const k in m)m[k].total=m[k].earned+m[k].bonus+m[k].awarded;
  return m;
}
function weekRange(){return{from:iso(S.week),to:iso(addDays(S.week,6))}}
const sortA=(a,b)=>(a.date||'').localeCompare(b.date||'')||(a.start||a.time||'').localeCompare(b.start||b.time||'')||(a.club||'').localeCompare(b.club||'');
function weekAssignments(){const{from,to}=weekRange();return S.assignments.filter(a=>a.date>=from&&a.date<=to).sort(sortA)}
function frameNumbers(list){const m={};list.forEach((a,i)=>m[a.id]=i+1);return m}

/* ---------- UI primitives ---------- */
function toast(msg,kind){const t=document.createElement('div');t.className='toast '+(kind||'');t.textContent=msg;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),kind==='err'?5600:3000)}
function errMsg(e){
  const c=e&&e.code;
  if(c==='invalid_argument'||c==='permission-denied')return S.readOnly||MODE==='firebase'?"You don't have permission to do that. Ask an Admin to give you the right role.":"That change didn't save because you can only view this page. Ask an Admin to share it with you as an Editor.";
  if(c==='quota_exceeded'||c==='resource-exhausted')return'Storage limit reached. Delete old shoots or email history, then try again.';
  if(c==='resource_exhausted')return'Too many changes at once. Wait a second and try again.';
  if(c==='revoked')return'Your access to this page changed. Reload to continue.';
  if(c==='unauthenticated')return'Sign in again to keep going.';
  return(e&&e.message)||'That didn’t work. Try again.';
}
async function W(fn,okMsg,kind){
  if(!DB){toast('Not connected. Sign in to make changes.','err');return false}
  try{await fn();if(okMsg)toast(okMsg,kind);return true}
  catch(e){
    if(e&&(e.code==='unavailable')){await new Promise(r=>setTimeout(r,600+Math.random()*700));try{await fn();if(okMsg)toast(okMsg,kind);return true}catch(e2){toast(errMsg(e2),'err');return false}}
    if(e&&e.code==='invalid_argument'&&MODE==='claude'&&S.canWrite!==true){S.readOnly=true;render()}
    toast(errMsg(e),'err');return false}
}
async function copyText(txt,label){
  try{await navigator.clipboard.writeText(txt);toast(label||'Copied')}
  catch(_){openModal({title:'Copy this',body:`<textarea readonly style="min-height:160px" id="cpy">${esc(txt)}</textarea><p class="help">Select all, then copy.</p>`,actions:[{label:'Done',cls:'ink'}]});setTimeout(()=>{const t=$('#cpy');t&&t.select()},50)}
}
function openModal({title,body,actions=[],wide=false,onOpen,cls=''}){
  const root=$('#modal-root');
  root.innerHTML=`<div class="ov"><div class="modal ${wide?'wide':''} ${cls}" role="dialog" aria-modal="true" aria-labelledby="mh"><div class="mh"><h2 id="mh">${esc(title)}</h2><button class="ibtn no-print" data-close aria-label="Close">${I.x}</button></div><div class="mb">${body}</div>${actions.length?`<div class="mf no-print">${actions.map((a,i)=>a.href?`<a class="btn ${a.cls||''}" href="${esc(a.href)}" target="_blank" rel="noopener" data-mi="${i}">${a.label}</a>`:`<button class="btn ${a.cls||''}" data-mi="${i}">${a.label}</button>`).join('')}</div>`:''}</div></div>`;
  const ov=$('.ov',root);
  ov.addEventListener('mousedown',e=>{if(e.target===ov)closeModal()});

  const f=$('.mb input:not([type=hidden]):not([readonly]):not([type=checkbox]),.mb select,.mb textarea',root);if(f&&!('ontouchstart'in window))f.focus();
}

function qrSVG(text){
  if(!window.qrcode)return'<p class="help">QR codes couldn’t load. Check your connection and reload.</p>';
  try{const q=qrcode(0,'M');q.addData(text);q.make();const n=q.getModuleCount(),m=4;let d='';
    for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c+m} ${r+m}h1v1h-1z`;
    return`<svg class="qr" viewBox="0 0 ${n+2*m} ${n+2*m}" shape-rendering="crispEdges" role="img" aria-label="QR code"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#17161B"/></svg>`}
  catch(e){return'<p class="help">That link is too long for a QR code.</p>'}
}

function doRender(){

  const v=VIEWS.find(x=>x.id===S.view);if(!v||!allowed(v))S.view='home';

  const ae=document.activeElement,aid=ae&&ae.id&&main.contains(ae)?ae.id:null,sel=aid&&ae.selectionStart!=null?[ae.selectionStart,ae.selectionEnd]:null;
  let html='';
  if(!DB)html+=`<div class="note red">${I.info}<div><b>Not connected.</b> Open this page while signed in to load the tracker.</div></div>`;
  else if(S.readOnly)html+=`<div class="note">${I.info}<div><b>You can look, but changes won’t save.</b> Ask an Admin to share this page with you as an Editor.</div></div>`;
  if(S.preview)html+=`<div class="note warn">${I.info}<div style="flex:1"><b>You’re previewing what a Member sees.</b> Officer buttons are hidden. Your own shoots still work as normal.</div><button class="btn sm ink" data-act="preview">Stop previewing</button></div>`;
  const allLoaded=['assignments','photographers','roles'].every(c=>S.loaded.has(c));
  if(DB&&!allLoaded)html+=`<div class="loading"><div class="spin"></div>Loading…</div>`;
  else html+=({home:vHome,assignments:vAssignments,points:vPoints,requests:vRequests,clubs:vClubs,email:vEmail,team:vTeam,config:vConfig,help:vHelp}[S.view])();
  main.innerHTML=html;main.dataset.view=S.view;
  if(aid){const el=document.getElementById(aid);if(el){el.focus();if(sel&&el.setSelectionRange)try{el.setSelectionRange(sel[0],sel[1])}catch(_){}}}
  if(S.view==='team')fillProfiles();
  if(S.view==='email')initEmail();
  if(allLoaded)handlePending();
}

function homeItem(a,mp,mine){

function personLine(a,p,mp,man){

function wirePicker(root,emptyText){

async function submitForCredit(id,pid,link){

function findByName(name){const n=norm(name),d=norm(displayName(name));return S.photographers.find(p=>norm(p.name)===n||norm(displayName(p.name))===n||norm(p.name)===d)}
function parseBulk(txt){
  const add=[],upd=[];let skip=0;const seen=new Set();
  for(let line of String(txt).split(/\r?\n/)){
    line=line.trim();if(!line||norm(line)==='n/a'){if(line)skip++;continue}
    let email='';const m=line.match(/[^\s,;<>]+@[^\s,;<>]+\.[a-z]{2,}/i);if(m){email=m[0].toLowerCase();line=line.replace(m[0],'')}
    const name=line.split(/\t/).filter(x=>x.trim())[0]?.replace(/[,;\s]+$/,'').trim()||'';
    if(!name&&email){const p=S.photographers.find(x=>norm(x.email)===email);if(p){skip++;continue}}
    if(!name){skip++;continue}
    if(seen.has(norm(name))){skip++;continue}seen.add(norm(name));
    const ex=findByName(name);
    if(ex){if(email&&norm(ex.email)!==email)upd.push({id:ex.id,email});else skip++;continue}
    add.push({name,email});
  }
  return{add,upd,skip};
}

async function submitRequest(data){
  if(!data.photographerId||!data.club||!data.date){toast('Choose your name, a club and a date.','err');return false}
  const dup=S.requests.find(r=>r.photographerId===data.photographerId&&norm(r.club)===norm(data.club)&&r.date===data.date&&r.status!=='declined');
  if(dup){toast('You already asked for that one. It’s '+(dup.status==='pending'?'waiting for approval.':'approved.'),'err');return false}
  return await W(()=>DB.collection('requests').add(Object.assign({status:'pending',at:nowISO(),by:S.me.id||'',note:'',assignmentId:''},data)),'Request sent. An officer will approve it.');
}
async function approveRequest(r){
  let a=r.assignmentId&&S.assignments.find(x=>x.id===r.assignmentId);
  if(!a)a=S.assignments.find(x=>norm(x.club)===norm(r.club)&&x.date===r.date);
  let ok;
  if(a){const full=clone(a);delete full.id;full.photographers=Array.from(new Set([...(full.photographers||[]),r.photographerId]));full.updatedAt=nowISO();ok=await W(()=>DB.doc('assignments/'+a.id).set(full))}
  else{const c=clubByName(r.club);ok=await W(()=>DB.collection('assignments').add({date:r.date,start:'',end:'',club:c?c.name:r.club,location:'',task:'',notes:r.note||'',driveLink:'',full:false,photographers:[r.photographerId],completions:{},checkins:{},createdAt:nowISO(),createdBy:S.me.id||''}))}
  if(ok)await W(()=>DB.doc('requests/'+r.id).update({status:'approved',decidedAt:nowISO(),decidedBy:S.me.id||''}),`Approved. ${displayName(pName(r.photographerId))} is on ${a?'the shoot':'a new shoot'}.`);
}

/* ---------- Email ---------- */
const canRelay=()=>MODE==='firebase'&&!!CFG.mailRelayUrl&&canManage();
async function relaySend({to=[],bcc=[],subject,body}){
  const u=FB&&FB.auth.currentUser;if(!u)throw new Error('Sign in again to send email.');
  const idToken=await u.getIdToken();
  const r=await fetch(CFG.mailRelayUrl,{method:'POST',body:JSON.stringify({idToken,to,bcc,subject,body,replyTo:S.me.email||''})});
  let j;try{j=await r.json()}catch(_){throw new Error('The email service didn’t answer. Check the mail relay URL in config.js.')}
  if(!j.ok)throw new Error(j.error||'The email didn’t send.');
  return j;
}
function audienceOptions(){
  const wk=weekAssignments();
  return{
    roster:{label:'Everyone on the roster',get:()=>pplEmails(S.photographers.map(p=>p.id))},
    week:{label:'Photographers with shoots this week',get:()=>{const ids=new Set();wk.forEach(a=>(a.photographers||[]).forEach(p=>{if(!(a.completions||{})[p])ids.add(p)}));return pplEmails([...ids])}},
    assignment:{label:'Photographers on one shoot',get:()=>{const a=S.assignments.find(x=>x.id===S.emailDraft?.assignmentId);if(!a)return[];const left=(a.photographers||[]).filter(p=>!(a.completions||{})[p]);return pplEmails(left.length?left:(a.photographers||[]))}},
    club:{label:'Photographers who’ve shot one club',get:()=>{const c=norm(S.emailDraft?.club);const ids=new Set();S.assignments.filter(a=>norm(a.club)===c).forEach(a=>(a.photographers||[]).forEach(p=>ids.add(p)));return pplEmails([...ids])}},
    idle:{label:'Photographers with no shoots yet',get:()=>{const pm=pointsMap();return pplEmails(S.photographers.filter(p=>!pm[p.id].shoots.length&&!S.assignments.some(a=>(a.photographers||[]).includes(p.id))).map(p=>p.id))}},
    team:{label:'Admins, Managers and Members',get:()=>S.roles.filter(r=>r.email).map(r=>({name:r.role,email:r.email}))},
    people:{label:'Specific people',get:()=>(S.emailDraft?.people||[]).map(e=>({name:'',email:e}))}
  };
}
function pplEmails(ids){return ids.map(id=>{const p=pById(id);if(!p)return null;const e=p.email||'';return{name:displayName(p.name),email:e,missing:!e}}).filter(Boolean)}
function recipients(){
  const d=S.emailDraft;const raw=(audienceOptions()[d.audience]?.get()||[]);
  const seen=new Set(),out=[],missing=[];
  for(const r of raw){if(r.missing){missing.push(r.name);continue}const e=norm(r.email);if(!isEmail(e)||seen.has(e))continue;seen.add(e);out.push(r)}
  return{out,missing};
}

async function createEmailInvites(){
  const emails=Array.from(new Set($('#inv-emails').value.split(/[\s,;]+/).map(norm).filter(Boolean)));
  const bad=emails.filter(e=>!isEmail(e));if(!emails.length||bad.length){toast(bad.length?'Check these emails: '+bad.join(', '):'Add at least one email.','err');return}
  const pid=emails.length===1?$('#inv-pid').value:'';const created=[];
  for(const e of emails){
    const ex=S.invites.find(v=>v.email===e&&inviteState(v)==='pending'&&v.role===S.inviteRole);if(ex){created.push(ex);continue}
    const id=randCode(10),exp=Date.now()+30*864e5;
    const v={role:S.inviteRole,email:e,multi:false,status:'pending',photographerId:pid,createdAt:nowISO(),createdBy:S.me.id||'',expiresAt:new Date(exp).toISOString(),expiresMs:exp,acceptedBy:[]};
    if(await W(()=>DB.doc('invites/'+id).set(v)))created.push(Object.assign({id},v));
  }
  if(!created.length)return;
  if(pid){const p=pById(pid);if(p&&!p.email)await W(()=>DB.doc('photographers/'+pid).update({email:emails[0]}))}
  $('#inv-emails').value='';
  if(canRelay()){
    let sent=0;for(const v of created){try{await relaySend({to:[v.email],subject:INV_SUBJ,body:inviteEmailBody(v)});sent++}catch(e){toast(e.message,'err');break}}
    if(sent)toast(`Sent ${plural(sent,'invite')}`,'gold');return;
  }
  const first=created[0];
  const body=created.length===1?inviteEmailBody(first):`Hi,\n\nYou’re invited to join the Element photo tracker as a ${S.inviteRole}.\n\n${ROLE_DESC[S.inviteRole]}\n\nFind your email below and open your link to join:\n${created.map(v=>`${v.email}: ${inviteLink(v.id)}`).join('\n')}\n\nElement Media`;
  showGmailModal('Invites ready',created.length>1?'Everyone is in BCC. Each person’s link is in the message.':'Send this from your Gmail.',created.length===1?gmailHref(first.email,INV_SUBJ,body):gmailHref('',INV_SUBJ,body,created.map(v=>v.email).join(',')),body);
}

      return;
    }
  }

function readLogo(file){
  return new Promise((res,rej)=>{
    if(file.size>8*1024*1024)return rej(new Error('Use an image under 8 MB.'));
    const fr=new FileReader();fr.onerror=()=>rej(new Error('Couldn’t read that file.'));
    fr.onload=()=>{if(file.type==='image/svg+xml'){if(fr.result.length>150000)return rej(new Error('That SVG is too large. Try a PNG.'));return res(fr.result)}
      const img=new Image();img.onload=()=>{const max=480,sc=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);let out=c.toDataURL('image/png');if(out.length>180000)out=c.toDataURL('image/webp',.9);if(out.length>180000)return rej(new Error('That logo is too detailed. Try a smaller PNG.'));res(out)};img.onerror=()=>rej(new Error('That file isn’t an image.'));img.src=fr.result};
    fr.readAsDataURL(file)});
}

async function importSeed(btn){
  btn.disabled=true;btn.textContent='Importing…';
  try{const r=await fetch('seed.json');if(!r.ok)throw new Error('seed.json is missing from the site folder.');const ops=await r.json();
    let n=0;const chunk=20;
    for(let i=0;i<ops.length;i+=chunk){await Promise.all(ops.slice(i,i+chunk).map(o=>DB.doc(o.path).set(o.data)));n+=Math.min(chunk,ops.length-i);btn.textContent=`Importing… ${n}/${ops.length}`}
    toast(`Imported ${n} records`,'gold');
  }catch(e){toast(errMsg(e),'err');btn.disabled=false;btn.textContent='Import spreadsheet data'}
}

  if(h.startsWith('checkin-')){S.pending={type:'checkin',id:h.slice(8)};return}

/* ---------- Data subscriptions ---------- */
const SUBS={};
const BASE_COLS=['assignments','photographers','clubs','roles','requests','awards'];
const MANAGER_COLS=['invites','emails'];
function sub(c){
  if(SUBS[c]||!DB)return;
  SUBS[c]=DB.collection(c).onSnapshot(snap=>{S[c]=snap.docs.map(d=>Object.assign({id:d.id},d.data()));S.loaded.add(c);if(c==='roles')syncSubs();render()},
    err=>{S.loaded.add(c);if(!(err&&(err.code==='permission-denied')))toast(errMsg(err),'err');render()});
}
function unsub(c){if(SUBS[c]){try{SUBS[c]()}catch(_){}delete SUBS[c]}S[c]=[];S.loaded.delete(c)}
function syncSubs(){
  BASE_COLS.forEach(sub);if(MODE==='firebase')sub('users');
  if(canManage()||MODE==='claude')MANAGER_COLS.forEach(sub);else MANAGER_COLS.forEach(unsub);
}

/* ---------- Boot: Firebase (self-hosted) ---------- */
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Could not load '+src));document.head.appendChild(s)})}
function signInError(e){
  const c=e&&e.code||'';
  if(c==='auth/unauthorized-domain')return'This website isn’t approved for sign-in yet. Add it under Firebase Authentication, Settings, Authorized domains.';
  if(c==='auth/popup-blocked')return'Your browser blocked the sign-in window. Allow pop-ups for this site and try again.';
  if(c==='auth/network-request-failed')return'No connection. Check your internet and try again.';
  if(/missing initial state/i.test(e&&e.message||''))return'Sign-in was interrupted by your browser’s privacy settings. Try again, or open the site in Safari or Chrome directly (not inside another app).';
  return(e&&e.message)||'Sign-in didn’t work. Try again.';
}
async function signInGoogle(){
  try{const p=new firebase.auth.GoogleAuthProvider();if(CFG.googleHostedDomain)p.setCustomParameters({hd:CFG.googleHostedDomain,prompt:'select_account'});else p.setCustomParameters({prompt:'select_account'});
    try{await FB.auth.signInWithPopup(p)}catch(e){if(e&&(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment'))await FB.auth.signInWithRedirect(p);else if(e&&e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')throw e}}
  catch(e){toast(signInError(e),'err')}
}
async function bootFirebase(){
  const v='10.12.2',b=`https://www.gstatic.com/firebasejs/${v}/`;
  try{await loadScript(b+'firebase-app-compat.js');await loadScript(b+'firebase-auth-compat.js');await loadScript(b+'firebase-firestore-compat.js')}
  catch(e){$('#root').innerHTML=`<div class="loading">Couldn’t load sign-in. Check your connection and reload.</div>`;return}
  const fcfg=Object.assign({},CFG.firebase);
  // Sign in through this site's own address (proxied to Firebase by _redirects),
  // so Safari and other privacy-focused browsers don't lose the sign-in state.
  if(CFG.authProxy&&location.protocol==='https:'&&!/\.(firebaseapp\.com|web\.app)$/.test(location.hostname))fcfg.authDomain=location.host;
  firebase.initializeApp(fcfg);
  FB={auth:firebase.auth()};DB=firebase.firestore();
  FB.auth.getRedirectResult().catch(e=>{if(e&&e.code&&e.code!=='auth/no-auth-event')toast(signInError(e),'err')});
  const owners=(CFG.ownerEmails||[]).map(norm);
  DB.doc('app/settings').onSnapshot(s=>{S.settings=s.exists?s.data():{};render()},()=>{});
  USER={me:async()=>S.me,can:async()=>true,profiles:async ids=>{const out={};for(const id of[].concat(ids)){const u=S.users.find(x=>x.id===id);out[id]={id,name:u?.name||'',avatarUrl:u?.photo||avatarData(u?.name||'?'),email:u?.email||null}}return out}};
  FB.auth.onAuthStateChanged(async u=>{
    if(!u){S.signedIn=false;S.me={id:null,email:null,name:'',isOwner:false,avatarUrl:''};unsubAll();S.inviteChecked=false;S.mySub=null;S.mySubChecked=false;$('#root').innerHTML='';render();return}
    S.signedIn=true;S.canWrite=true;
    S.me={id:u.uid,email:norm(u.email),name:u.displayName||'',isOwner:owners.includes(norm(u.email)),avatarUrl:u.photoURL||avatarData(u.displayName||u.email)};
    DB.doc('users/'+u.uid).set({name:u.displayName||'',email:norm(u.email),photo:u.photoURL||'',lastSeen:nowISO()}).catch(()=>{});
    $('#root').innerHTML='';syncSubs();render();
  });
  render();
}

/* ---------- Start ---------- */
parseHash();
if(MODE==='firebase')bootFirebase();else bootClaude();
</script>
</body>
